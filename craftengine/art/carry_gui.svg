<svg xmlns="http://www.w3.org/2000/svg" width="176" height="222" viewBox="0 0 176 222">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2a2c"/>
      <stop offset="0.52" stop-color="#151e21"/>
      <stop offset="1" stop-color="#0c1316"/>
    </linearGradient>
    <linearGradient id="topRail" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#273537"/>
      <stop offset="0.58" stop-color="#1b282b"/>
      <stop offset="1" stop-color="#26302b"/>
    </linearGradient>
    <linearGradient id="cyanRail" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#23777b"/>
      <stop offset="0.72" stop-color="#6edbd6"/>
      <stop offset="1" stop-color="#d0fff8"/>
    </linearGradient>
    <linearGradient id="oliveRail" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#4b5545"/>
      <stop offset="1" stop-color="#8b986f"/>
    </linearGradient>
    <pattern id="topSlots" x="8" y="18" width="18" height="18"
        patternUnits="userSpaceOnUse">
      <rect x="0.5" y="0.5" width="17" height="17" rx="1" fill="none"
          stroke="#3b4b4d" stroke-width="1"/>
      <path d="M1 5V1h4M13 1h4v4M17 13v4h-4M5 17H1v-4" fill="none"
          stroke="#65705d" stroke-opacity="0.7" stroke-width="0.7"/>
    </pattern>
    <pattern id="inventorySlots" x="8" y="140" width="18" height="18"
        patternUnits="userSpaceOnUse">
      <rect x="0.5" y="0.5" width="17" height="17" rx="1" fill="none"
          stroke="#354447" stroke-width="1"/>
    </pattern>
    <pattern id="hotbarSlots" x="8" y="198" width="18" height="18"
        patternUnits="userSpaceOnUse">
      <rect x="0.5" y="0.5" width="17" height="17" rx="1" fill="none"
          stroke="#52615c" stroke-width="1"/>
      <path d="M2 2h3M2 2v3M15 2h-3M15 2v3" fill="none" stroke="#6edbd6"
          stroke-opacity="0.48" stroke-width="0.7"/>
    </pattern>
    <pattern id="slotCutout" x="8" y="18" width="18" height="18"
        patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="white"/>
      <rect x="-0.5" y="-0.5" width="17" height="17" fill="black"/>
    </pattern>
    <pattern id="inventoryCutout" x="8" y="140" width="18" height="18"
        patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="white"/>
      <rect x="-0.5" y="-0.5" width="17" height="17" fill="black"/>
    </pattern>
    <pattern id="hotbarCutout" x="8" y="198" width="18" height="18"
        patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="white"/>
      <rect x="-0.5" y="-0.5" width="17" height="17" fill="black"/>
    </pattern>
    <mask id="shellMask" maskUnits="userSpaceOnUse" x="0" y="0" width="176" height="222">
      <rect width="176" height="222" rx="4" fill="white"/>
      <rect x="8" y="18" width="162" height="108" fill="url(#slotCutout)"/>
      <rect x="8" y="140" width="162" height="54" fill="url(#inventoryCutout)"/>
      <rect x="8" y="198" width="162" height="18" fill="url(#hotbarCutout)"/>
    </mask>
  </defs>

  <!-- The final artwork mask guarantees no later border or label can cover an item icon. -->
  <g mask="url(#shellMask)">
  <!-- Opaque tactical shell with every item-bearing 16x16 cell punched transparent. -->
  <g>
    <rect width="176" height="222" rx="4" fill="url(#shell)"/>
    <rect x="2" y="2" width="172" height="13" rx="2" fill="url(#topRail)"/>
    <path d="M2 14h172v2H2z" fill="url(#cyanRail)" opacity="0.92"/>
    <path d="M0 128h176v10H0z" fill="#111a1d"/>
    <path d="M4 130h168" stroke="#4f5e53" stroke-width="1"/>
    <path d="M4 136h168" stroke="#19363a" stroke-width="1"/>
    <rect x="4" y="196" width="168" height="22" rx="2" fill="#172123"/>
    <path d="M4 196h168" stroke="url(#oliveRail)" stroke-width="1.5"/>
    <path d="M1 1h174v220H1z" fill="none" stroke="#071013" stroke-width="2"/>
    <path d="M3 3h170v216H3z" fill="none" stroke="#425255" stroke-width="1"/>
  </g>

  <!-- Region silhouettes: starter layout, still readable if cells are dynamically locked. -->
  <g fill="none" shape-rendering="crispEdges">
    <path d="M7 17h72v72H7z" stroke="#6f7e61" stroke-width="1.5"/>
    <path d="M7 17h18M7 17v18M79 71v18H61" stroke="#a1ae7f" stroke-width="1"/>
    <path d="M79 17h54v54H79z" stroke="#2d8589" stroke-width="1.5"/>
    <path d="M79 17h15M79 17v15M133 56v15h-15" stroke="#72d8d4" stroke-width="1"/>
    <path d="M133 17h36v54H133z" stroke="#88956c" stroke-width="1.5"/>
    <path d="M133 17h11M169 60v11h-11" stroke="#c0cb92" stroke-width="1"/>
    <path d="M79 71h90v36H79z" stroke="#9a7137" stroke-width="1.5"/>
    <path d="M79 71h13M169 94v13h-13" stroke="#e0a44d" stroke-width="1"/>
    <path d="M7 89h72v36H7z" stroke="#50615b" stroke-width="1"/>
    <path d="M115 107h18v18h-18z" stroke="#6edbd6" stroke-width="1.5"/>
    <path d="M133 107h18v18h-18z" stroke="#79866a" stroke-width="1"/>
    <path d="M151 107h18v18h-18z" stroke="#975a4f" stroke-width="1"/>
  </g>

  <!-- Standard slot borders are separate from the transparent interiors. -->
  <rect x="8" y="18" width="162" height="108" fill="url(#topSlots)"/>
  <rect x="8" y="140" width="162" height="54" fill="url(#inventorySlots)"/>
  <rect x="8" y="198" width="162" height="18" fill="url(#hotbarSlots)"/>

  <!-- Compact baked labels; bitmap text avoids client font/resource ambiguity. -->
  <g font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-weight="600"
      text-rendering="geometricPrecision">
    <g font-size="5.5" fill="#b8c5b6" letter-spacing="0.25">
      <text x="18" y="10.5">背包</text>
      <text x="34" y="10.5" fill="#718277">PACK · 12</text>
      <text x="87" y="10.5" fill="#8ce7e1">胸挂</text>
      <text x="103" y="10.5" fill="#568a89">RIG · 6</text>
      <text x="139" y="10.5" fill="#c3ce96">口袋 ×4</text>
    </g>
    <g font-size="4.6" letter-spacing="0.15">
      <text x="8" y="135" fill="#e1a851">装备 / GEAR</text>
      <text x="47" y="135" fill="#7ce4df">安全箱 / SECURE</text>
      <text x="104" y="135" fill="#8f9e8c">随身 / INVENTORY</text>
    </g>
  </g>

  <!-- Original pictograms and compartment markers. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 6h5l1.4 5H6.6zm1.2 0V4.7h3.6V6" stroke="#69d9d5" stroke-width="1"/>
    <path d="M7 218h162" stroke="#66d8d3" stroke-opacity="0.32" stroke-width="1"/>
  </g>
  </g>
</svg>
