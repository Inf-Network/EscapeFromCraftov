# ============================================================================
#  RaidCoreGame 主配置(config.yml)
#  Escape from Craftov · 逃离块科夫 —— 游戏服务端核心设置
# ============================================================================
#
#  ◆ 本文件的作用
#    游戏服务端的身份标识、对局实例规则与跨服网络行为都在这里配置。
#    修改后需重启服务器生效。
# ============================================================================

# 调试模式。类型:布尔。开启后输出更详细的运行日志(定位问题用,平时关闭)。
debug: false

# ---------------------------------------------------------------------------
# 服务器身份:同一 Redis 网络内每台游戏服务端必须唯一。
# ---------------------------------------------------------------------------
server:
  # 本服在 Redis 实例目录中的唯一 ID。类型:字符串,格式 [a-z0-9_-]+。
  # 示例:game-01、game-02……多台游戏服务端绝不能重复。
  id: game-01

  # 本服在 Velocity/BungeeCord 代理中注册的服务器名。类型:字符串。
  # 大厅匹配成功后就是用这个名字把玩家 /server 过来的,必须与代理配置一致。
  proxy-name: raid-01

# ---------------------------------------------------------------------------
# 对局实例规则。
# ---------------------------------------------------------------------------
game:
  # 单个对局实例的最大玩家数。类型:整数,必须 > 0。
  max-players: 12

  # 每支队伍的人数上限(加入对局时自动分队)。类型:整数,必须 > 0。
  team-size: 3

  # 对局时长(秒)。到时自动结算并结束对局。类型:整数,必须 > 0。
  # 默认 1800 秒 = 30 分钟。
  duration-seconds: 1800

  # 本服同时承载的对局实例上限。类型:整数,必须 > 0。
  # 每个实例运行在独立的世界中;实例越多,内存与 tick 压力越大,
  # 请结合服务器硬件调整。
  max-instances: 4

  # 自动补备:保持随时可加入(WAITING 且世界就绪)的实例数量。
  # 类型:整数,0 ~ max-instances。0 表示只按需创建(大厅提示后才补)。
  min-ready-instances: 1

  # 地图模板目录(相对本插件数据目录 plugins/RaidCoreGame/)。类型:字符串。
  # 每个实例创建时会把 <此目录>/<地图ID>/ 整份复制为新世界;
  # 模板缺失时退化为平坦世界并输出警告(仅供开发调试)。
  map-template-dir: maps

# ---------------------------------------------------------------------------
# 跨服网络行为。
# ---------------------------------------------------------------------------
network:
  # 是否位于 Velocity/BungeeCord 代理之后。类型:布尔。
  # true:撤离/对局结束后把玩家送回大厅服务器;
  # false:单服模式,玩家改为传送回本服主世界出生点。
  proxy-enabled: true

  # 大厅服务器在代理中的名字(proxy-enabled 为 true 时必填)。类型:字符串。
  lobby-server-name: lobby

  # 实例目录快照的发布间隔(秒)。类型:整数,必须 > 0。
  # 快照的 Redis TTL 为该值的 3 倍;调小匹配更灵敏,调大 Redis 压力更低。
  snapshot-interval-seconds: 2

# ---------------------------------------------------------------------------
# 撤离规则。
# ---------------------------------------------------------------------------
extraction:
  # 撤离引导的默认时长(秒):玩家在撤离点站立引导这么久后撤离成功。
  # 类型:整数,必须 > 0。
  default-duration-seconds: 10
