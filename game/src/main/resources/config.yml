# ============================================================================
#  EscapeFromCraftovGame 主配置(config.yml)
#  Escape from Craftov · 逃离块科夫 —— 游戏服务端核心设置
# ============================================================================
#
#  ◆ 本文件的作用
#    游戏服务端的身份标识、对局实例规则与跨服网络行为都在这里配置。
#    修改后需重启服务器生效。
# ============================================================================

# 调试模式。类型:布尔。开启后输出更详细的运行日志(定位问题用,平时关闭)。
debug: false

# ---------------------------------------------------------------------------
# 服务器身份:同一 Redis 网络内每台游戏服务端必须唯一。
# ---------------------------------------------------------------------------
server:
  # 本服在 Redis 实例目录中的唯一 ID。类型:字符串,格式 [a-z0-9_-]+。
  # 示例:game-01、game-02……多台游戏服务端绝不能重复。
  id: game-01

  # 本服在 Velocity/BungeeCord 代理中注册的服务器名。类型:字符串。
  # 大厅匹配成功后就是用这个名字把玩家 /server 过来的,必须与代理配置一致。
  proxy-name: craftov-01

# ---------------------------------------------------------------------------
# 对局实例规则。
# ---------------------------------------------------------------------------
game:
  # 自动补备与 /craftov game create 不带地图参数时使用的地图 ID。
  # 对应模板目录必须存在；生产环境不会静默生成调试地图。
  default-map: debug_zone

  # 单个对局实例的最大玩家数。类型:整数,必须 > 0。
  max-players: 12

  # 每支队伍的人数上限(加入对局时自动分队)。类型:整数,必须 > 0。
  team-size: 3

  # 房间达到多少名玩家后自动开始倒计时。范围 1..max-players。
  # 人数在倒计时期间不足时会自动取消；管理员仍可手工 /craftov game start。
  minimum-players: 2

  # 达到最低人数后的自动开局倒计时(秒)。范围 3..300。
  start-countdown-seconds: 15

  # 对局时长(秒)。到时自动结算并结束对局。类型:整数,必须 > 0。
  # 默认 1800 秒 = 30 分钟。
  duration-seconds: 1800

  # 本服同时承载的对局实例上限。类型:整数,必须 > 0。
  # 每个实例运行在独立的世界中;实例越多,内存与 tick 压力越大,
  # 请结合服务器硬件调整。
  max-instances: 4

  # 自动补备:保持随时可加入(WAITING 且世界就绪)的实例数量。
  # 类型:整数,0 ~ max-instances。0 表示只按需创建(大厅提示后才补)。
  min-ready-instances: 1

  # 地图模板目录(相对本插件数据目录 plugins/EscapeFromCraftovGame/)。类型:字符串。
  # 每个实例创建时会把 <此目录>/<地图ID>/ 整份复制为新世界;
  # 管理员覆盖地图也可使用 /craftov map create 时登记的世界目录作为只读复制来源。
  map-template-dir: maps

  # 仅限本地开发。false 时地图模板缺失会让实例创建失败并自动销毁，
  # 避免玩家被送进意外生成的空白地图；生产环境必须保持 false。
  allow-flat-fallback: false

# ---------------------------------------------------------------------------
# 跨服网络行为。
# ---------------------------------------------------------------------------
network:
  # 大厅服务器在 Velocity/BungeeCord 代理中的名字。游戏服为专用角色，
  # 未分配玩家与结束对局的玩家都会被送回这里，不提供单服 Lobby 回退。
  lobby-server-name: lobby

  # 实例目录快照的发布间隔(秒)。类型:整数,必须 > 0。
  # 快照的 Redis TTL 为该值的 3 倍;调小匹配更灵敏,调大 Redis 压力更低。
  snapshot-interval-seconds: 2

# ---------------------------------------------------------------------------
# 撤离规则。
# ---------------------------------------------------------------------------
extraction:
  # 撤离引导的默认时长(秒):玩家在撤离点站立引导这么久后撤离成功。
  # 类型:整数,必须 > 0。
  default-duration-seconds: 10

# ---------------------------------------------------------------------------
# Minecraft 原生战斗与玩家界面。
# ---------------------------------------------------------------------------
combat:
  # 同一队伍成员是否可以互相造成伤害。默认关闭，跨队 PvP 始终受允许。
  friendly-fire: false
  # 最近一次有效攻击者保留多少秒，用于死亡击杀归属与击杀提示。
  attribution-seconds: 15

scoreboard:
  # 编辑器和 Craftov 中的个人动态 Sidebar 总开关。
  enabled: true
  # 刷新间隔 tick。10 = 0.5 秒；只更新内容，不重建玩家 Scoreboard。
  refresh-ticks: 10

inventory:
  # Loot 搜索箱的虚拟容器大小，必须是 9 的倍数，范围 9..54。
  loot-container-size: 27

# 长期行动等级奖励。经验和等级保存在 PostgreSQL，并带幂等奖励流水。
progression:
  # 成功撤离后获得的经验。
  extraction-experience: 250
  # 在行动中阵亡仍获得的参与经验。
  death-experience: 25
  # 击败一名敌对玩家获得的经验。
  kill-experience: 100

# ---------------------------------------------------------------------------
# 游戏内地图编辑器。管理员导入地图后，所有正式点位都在这里人工配置。
# ---------------------------------------------------------------------------
map-editor:
  # 每张地图保留多少个旧 revision，不含当前版本。范围 1 ~ 20。
  retained-revisions: 3
  # 批量删除等危险操作的 /craftov editor confirm 有效时间。范围 5 ~ 60 秒。
  confirmation-seconds: 15
  # 管理员进入编辑器后的默认个人可视半径。范围 16 ~ 512 格。
  default-visibility-radius: 96

  visualization:
    # 粒子与 ActionBar 刷新间隔。10 ticks = 0.5 秒；不进行每 tick 全图扫描。
    refresh-ticks: 10
    # 单个管理员每帧最多渲染的附近对象。区块索引先过滤，再应用此上限。
    maximum-objects-per-frame: 160
    # 单个管理员最多同时看到多少个个人全息标签。选中对象和错误对象优先显示。
    maximum-holograms-per-player: 32

  validation:
    # ERROR 会阻止地图启用；WARNING 只提醒管理员。
    minimum-spawns: 2
    minimum-extractions: 2
    # 以下三项是建议值，缺少时显示 WARNING，不会阻止地图启用。
    minimum-loot-zones: 1
    minimum-ai-zones: 1
    minimum-pois: 1
    minimum-spawn-distance: 32.0
    minimum-spawn-extraction-distance: 64.0

# ---------------------------------------------------------------------------
# PostgreSQL 持久化。游戏服强依赖数据库，启动时会验证连接，并按 Hibernate
# schema-action 管理档案、设置与装扮表；失败会中止插件启动。
# ---------------------------------------------------------------------------
database:
  # PostgreSQL 地址、端口与数据库名。数据库需要预先创建；表结构由 Hibernate
  # 根据 orm.schema-action 管理。
  host: localhost
  port: 5432
  database: escapefromcraftov

  # 建议为 EscapeFromCraftov 创建独立低权限账号，仅授予本数据库的 DDL/DML 权限。
  username: escapefromcraftov
  password: change-me

  # PostgreSQL schema。Lobby 与 Game 必须一致；默认 public。
  schema: public

  # 自动建表时统一添加的表名前缀（同时应用于索引名）。Lobby 与 Game 必须一致。
  # 空字符串表示不加前缀；非空时须以小写字母开头，仅含小写字母、数字、下划线，
  # 最长 20 字符。示例："ec_" 会把 craftov_profiles 建成 ec_craftov_profiles。
  # 注意：已投产后修改前缀等于换一套全新表，旧表数据不会自动迁移。
  table-prefix: ""

  # PostgreSQL JDBC sslmode: disable / allow / prefer / require /
  # verify-ca / verify-full。公网数据库建议 verify-full。
  ssl-mode: prefer

  # 写入 PostgreSQL pg_stat_activity，便于区分连接来源。
  application-name: EscapeFromCraftovGame

  # JDBC 网络与批处理优化。
  tcp-keepalive: true
  rewrite-batched-inserts: true

  # 建立 TCP 连接的最大秒数，1 ~ 300；与下面“从池中借连接”的毫秒超时不同。
  connect-timeout-seconds: 10
  # 已建立连接读取网络数据的最大秒数；0 表示不限制。建议保留有限值，
  # 避免数据库/网络半断开时虚拟线程永久挂住。
  socket-timeout-seconds: 30

  # HikariCP 连接池。全部时间单位均为毫秒。
  pool:
    # 单台服最大连接数。虚拟线程不等于数据库可承受无限连接。
    maximum-pool-size: 10
    # 常驻空闲连接；允许为 0，且不得超过 maximum-pool-size。
    minimum-idle: 2
    # 获取连接最长等待时间，最小 250。
    connection-timeout: 10000
    # JDBC isValid 校验超时，最小 250 且必须小于 connection-timeout。
    validation-timeout: 5000
    # 空闲连接回收时间；0 表示禁用，非 0 最小 10000。
    idle-timeout: 600000
    # 单连接最长生命周期；应略短于数据库/代理的连接上限。
    max-lifetime: 1800000
    # 空闲连接保活间隔；0 表示禁用，必须小于 max-lifetime。
    keepalive-time: 120000
    # 连接泄漏检测；0 表示禁用，排障时可临时设置 >= 2000。
    leak-detection-threshold: 0
    # 启动连接校验等待时间：正数=在此毫秒数内建池失败即中止；0=尝试一次，
    # 无连接时仍启动；负数=跳过启动校验。Game/Lobby 强依赖数据库，推荐正数。
    initialization-fail-timeout: 1
    # 所有 ORM 事务的隔离级别。READ_COMMITTED 是 PostgreSQL 常规业务推荐值。
    transaction-isolation: TRANSACTION_READ_COMMITTED
    # 每条新物理连接创建后执行的 SQL；空字符串表示不执行。
    # 示例:"SET statement_timeout = '15s'"。错误 SQL 会导致连接创建失败。
    connection-init-sql: ""
    # autoCommit=false 时，把 Hikari 自身的校验 SQL 放在独立事务中。
    isolate-internal-queries: true
    # 通过 JMX 暴露连接池指标；同一 JVM 的 pool name 必须唯一。
    register-mbeans: false

  # Hibernate ORM。生产首次建表可用 update；结构稳定后建议改为 validate，
  # 并通过版本化数据库迁移管理变更。create/create-drop 会破坏数据。
  orm:
    schema-action: update
    # 同一事务中 INSERT/UPDATE 的 JDBC 批大小；0 禁用。配合上方
    # rewrite-batched-inserts 可显著减少 PostgreSQL 往返。
    statement-batch-size: 25
    # 延迟关联批量抓取大小；0 禁用。当前实体关联较少，16 为温和预留值。
    default-batch-fetch-size: 16
    # SQL 调试仅用于开发；show-sql 会直接向控制台输出，生产保持 false。
    show-sql: false
    format-sql: false
    # Hibernate 统计会增加运行开销，仅性能诊断时临时开启。
    generate-statistics: false

# ---------------------------------------------------------------------------
# 跨服 Redis。Game 与 Lobby 的地址、密码和 database 必须完全一致。
# ---------------------------------------------------------------------------
redis:
  host: localhost
  port: 6379
  password: ""
  database: 0
  pool:
    max-total: 8
    max-idle: 8
    min-idle: 1
