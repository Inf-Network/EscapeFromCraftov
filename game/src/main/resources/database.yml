# ============================================================================
#  RaidCoreGame 数据库配置(database.yml)
#  Escape from Craftov · 逃离块科夫 —— 游戏服务端 PostgreSQL 连接设置
# ============================================================================
#
#  ◆ 本文件的作用
#    玩家档案(金币、等级等长期数据)持久化在 PostgreSQL 中。
#    游戏服务端【强依赖】数据库:连接失败会直接中止启动并在控制台输出
#    中文错误说明。本项目只支持 PostgreSQL,没有其它数据库模式。
#
#  ◆ 修改后需重启服务器生效。
# ============================================================================

database:
  # PostgreSQL 服务器地址(IP 或域名)。类型:字符串。
  host: localhost

  # PostgreSQL 端口。类型:整数,范围 1-65535,默认 5432。
  port: 5432

  # 数据库名。需要事先创建(空库即可,表结构由插件启动时自动建立:
  # raid_profiles 玩家档案表)。类型:字符串。
  database: raidcore

  # 数据库账号。需要对上述数据库拥有建表与读写权限。类型:字符串。
  username: raidcore

  # 数据库密码。允许为空字符串(不推荐)。类型:字符串。
  # 安全提示:请务必修改默认值,不要把真实密码提交进版本库。
  password: change-me

  # HikariCP 连接池设置。一般保持默认即可。
  pool:
    # 池中最大连接数。类型:整数,必须 > 0。
    # 单个游戏服务端 10 已绰绰有余;调大只会增加数据库压力。
    maximum-pool-size: 10

    # 最小空闲连接数。类型:整数,必须 > 0 且 ≤ maximum-pool-size。
    minimum-idle: 2

    # 从池中借用连接的超时时间(毫秒)。类型:整数。
    # 超时会抛出异常并记录日志,过小容易误报,过大会拖慢故障发现。
    connection-timeout: 10000
