# ============================================================================
#  RaidCoreGame 消息配置(messages.yml)
#  Escape from Craftov · 逃离块科夫 —— 游戏服务端的全部玩家可见文本
# ============================================================================
#
#  ◆ 本文件的作用
#    游戏服务端发给玩家的每一条消息都定义在这里,修改保存后重启生效。
#
#  ◆ MiniMessage 语法速览(所有值均为 MiniMessage 格式,禁止 § 颜色码)
#    <gray>正文</gray>、<gold><bold>标题</bold></gold>、<green>成功</green>、
#    <red>错误</red>、<yellow>高亮</yellow>、<newline> 换行。
#    <占位符> 由插件运行时填充,见各消息旁注释;删除占位符不会报错,
#    但对应信息将不再显示。
#
#  ◆ 风格约定(Hypixel 式)
#    正文灰色、重点金黄、成功绿色、错误红色;游戏流程消息不带前缀,
#    prefix 仅用于管理/调试命令输出。
# ============================================================================

# 管理/调试命令输出的前缀(游戏流程消息不使用)。
prefix: "<gold>Raid</gold> <dark_gray>»</dark_gray> "

# ---------------------------------------------------------------------------
# Tab 列表页眉/页脚:品牌横幅(页眉两行:拉丁大标题 + 中文副标题)。
# ---------------------------------------------------------------------------
tab:
  header: "<gold><bold>ESCAPE FROM CRAFTOV</bold></gold><newline><gray>逃离块科夫</gray>"
  footer: "<gray>play.example.com</gray>"

# ---------------------------------------------------------------------------
# 命令输出。
#   help.entry     <command> = 命令用法;<description> = 命令说明
#   info.*         /raid info 状态总览;占位符见各行注释
#   game.*         /raid game 系列;<id> = 实例编号;<map> = 地图;
#                  <state> = 状态;<players> = 人数;<count> = 实例总数;
#                  <error> = 失败原因
#   debug.loot.*   /raid debug loot 掉落测试;<table> = 掉落表;
#                  <item> = 物品名;<quantity> = 数量
#   profile.*      /raid profile 个人档案;<player>/<balance>/<level>/<state>/
#                  <experience>/<progress>/<target>/<remaining>
# ---------------------------------------------------------------------------
command:
  no-permission: "<red>你没有权限这么做。</red>"
  player-only: "<red>该命令只能由玩家使用。</red>"
  help:
    header: "<gold><bold>ESCAPE FROM CRAFTOV</bold></gold> <dark_gray>·</dark_gray> <gray>命令列表</gray>"
    admin-header: "<gold><bold>RAIDCORE ADMIN</bold></gold> <dark_gray>·</dark_gray> <gray>管理员命令</gray>"
    admin-hint: "<gray>管理员可输入 <yellow>/raid help admin</yellow> 查看地图与实例命令。</gray>"
    entry: "<yellow>/<command></yellow> <dark_gray>-</dark_gray> <gray><description></gray>"
    # 每条命令的说明文字(由 entry 的 <description> 引用)。
    desc:
      help: "显示本帮助"
      tutorial: "查看一局行动的完整玩法"
      info: "查看插件运行状态"
      profile: "查看你的个人档案"
      map-import: "从地图文件夹导入 Minecraft 世界或完整 Raid 地图包"
      map-create: "创建一张由管理员手工编辑的 Raid 地图"
      map-manage: "查看、启用或停用已导入的地图"
      map-list: "列出本服已登记的地图"
      map-info: "查看指定地图的版本、点位和启用状态"
      map-preview: "进入个人可视的地图预览与高级编辑模式"
      map-enable: "验证并允许指定地图创建新房间"
      map-disable: "禁止指定地图创建新房间"
      editor-toggle: "按当前世界进入或退出地图编辑模式"
      editor-enter: "进入独立的可视化地图编辑会话"
      editor-wand: "领取双点选区工具"
      editor-bounds: "把当前选区设为地图边界"
      editor-tool: "切换编辑器当前工具"
      editor-create: "创建出生点、Loot、AI、撤离点或 POI"
      editor-property: "修改当前选中对象的名称、等级、条件和启用状态"
      editor-edit: "选择、移动、删除或克隆地图对象"
      editor-info: "查看准星指向或指定对象的完整属性"
      editor-tp: "安全传送到准星指向或指定对象附近"
      editor-batch: "对当前选区批量启用、停用、改物资、改等级或删除"
      editor-nearby: "按距离列出可视范围内的地图对象"
      editor-preview: "显示或隐藏个人预览标记和地图边界"
      editor-save: "验证并原子保存当前地图修订"
      editor-history: "查看修订历史或恢复指定版本"
      game-create: "创建一个对局实例"
      game-list: "列出当前实例"
      game-start: "管理员跳过自动倒计时，立即开始指定实例"
      game-stop: "结束指定实例"
      debug: "查看运行时计数"
      debug-loot: "掷取一次掉落表"
  tutorial:
    header: "<gold><bold>搜打撤怎么玩?</bold></gold>"
    line-1: "<gray>1. 在大厅选择地图并加入匹配，带着准备好的装备进入行动。</gray>"
    line-2: "<gray>2. 搜索建筑和物资点；高价值区域通常也更危险。</gray>"
    line-3: "<gray>3. 你会遇到其他玩家，未来也会遇到地图 AI；交战不是唯一目标。</gray>"
    line-4: "<gray>4. 背包装满后前往撤离点，部分出口需要等待、付费或携带钥匙。</gray>"
    line-5: "<gray>5. 进入撤离区域会自动开始倒计时，离开区域会取消。</gray>"
    line-6: "<yellow>只有成功撤离，找到的物资才算真正带回；死亡可能失去随身物品。</yellow>"
  info:
    header: "<gold><bold>ESCAPE FROM CRAFTOV</bold></gold> <dark_gray>·</dark_gray> <gray>运行状态</gray>"
    # <version> 插件版本;<minecraft> MC 版本;<java> Java 版本
    version: "<gray>版本 <yellow><version></yellow>,Minecraft <yellow><minecraft></yellow> <dark_gray>(</dark_gray><gray>Java <java></gray><dark_gray>)</dark_gray></gray>"
    # <modules> 已加载模块列表
    modules: "<gray>模块:<yellow><modules></yellow></gray>"
    # <items> 物品数;<tables> 掉落表数;<games> 对局数;<sessions> 会话数
    stats: "<gray>物品 <yellow><items></yellow>,掉落表 <yellow><tables></yellow>,对局 <yellow><games></yellow>,会话 <yellow><sessions></yellow></gray>"
  game:
    created: "<green>已创建实例 <yellow><id></yellow>,地图 <yellow><map></yellow>。</green>"
    not-found: "<red>找不到实例 <id>。</red>"
    list-header: "<gray>当前实例:<gold><count></gold> 个</gray>"
    list-entry: "<yellow><id></yellow> <dark_gray>-</dark_gray> <map> <dark_gray>·</dark_gray> <state> <dark_gray>·</dark_gray> <gray><players> 名玩家</gray> <dark_gray>·</dark_gray> <world>"
    list-empty: "<gray>当前没有运行中的实例。</gray>"
    started: "<green>实例 <yellow><id></yellow> 已开始。</green>"
    stopped: "<green>实例 <yellow><id></yellow> 已结束。</green>"
    world-not-ready: "<yellow>实例 <id> 的地图副本仍在准备，请稍后再试。</yellow>"
    error: "<red><error></red>"
  debug:
    status: "<gray>调试 <yellow><debug></yellow>:<yellow><modules></yellow> 个模块,<yellow><services></yellow> 个服务,<yellow><games></yellow> 场对局,<yellow><sessions></yellow> 个会话</gray>"
    loot:
      header: "<gray>掉落表 <yellow><table></yellow> 的一次掷取:</gray>"
      entry: "<dark_gray>· </dark_gray><gray><item></gray> <dark_gray>x</dark_gray><yellow><quantity></yellow>"
      unknown-table: "<red>未知的掉落表:<table></red>"
  profile:
    header: "<gold><bold><player></bold></gold> <dark_gray>·</dark_gray> <gray>个人档案</gray>"
    balance: "<gray>金币: <gold><balance></gold></gray>"
    level: "<gray>行动等级: <yellow><level></yellow></gray>"
    experience: "<gray>累计历练: <aqua><experience></aqua></gray>"
    level-progress: "<gray>本级历练: <aqua><progress></aqua><dark_gray>/</dark_gray><aqua><target></aqua></gray>"
    next-level: "<gray>距离升级: <yellow><remaining></yellow> 点历练</gray>"
    state: "<gray>档案状态: <yellow><state></yellow></gray>"
# ---------------------------------------------------------------------------
# 进服流程。
#   profile-loaded  档案加载完成后的欢迎语
#   profile-failed  档案加载失败(玩家需要重进或联系管理员)
# ---------------------------------------------------------------------------
join:
  profile-loaded: "<gray>欢迎来到</gray> <gold><bold>Escape from Craftov</bold></gold> <gray>·</gray> <yellow>逃离块科夫</yellow>"
  profile-failed: "<red>你的档案加载失败,请重新进入服务器或联系管理员。</red>"
  editor-ready: "<green>编辑权限已验证。</green> <gray>输入 <yellow>/raid map list</yellow> 查看地图，或使用 <yellow>/raid editor enter <地图></yellow> 开始编辑。</gray>"

# ---------------------------------------------------------------------------
# 对局流程。
#   sent-to-instance  按匹配分配进入实例;<map> = 地图;<id> = 实例编号
#   assignment-invalid  分配失效(实例已满/已开始等);<reason> = 原因
# ---------------------------------------------------------------------------
game:
  assignment-missing: "<red>没有找到有效的匹配分配,正在送你返回大厅。</red>"
  assignment-unavailable: "<red>匹配服务暂时不可用,正在送你返回大厅。</red>"
  sent-to-instance: "<green>匹配成功!正在进入 <yellow><map></yellow>……</green>"
  instance-full: "<red>该对局实例已满员。</red>"
  returned-to-lobby: "<gray>你已返回大厅。</gray>"
  return-save-failed: "<red>你的个人资料还没同步完成，本次暂不跨服。请稍后重试或联系管理员。</red>"
  end-settlement-failed: "<red>对局已结束，但本局物资还在处理中。请不要离开此服务器并联系管理员。</red>"
  assignment-invalid: "<red>无法加入对局:<reason></red>"
  start-countdown-title: "<gold><bold><seconds></bold></gold>"
  start-countdown-subtitle: "<gray>准备进入行动</gray>"
  start-countdown-actionbar: "<yellow><seconds></yellow> <gray>秒后开始</gray> <dark_gray>·</dark_gray> <aqua><players>/<minimum></aqua>"
  start-cancelled-title: "<red>倒计时取消</red>"
  start-cancelled-subtitle: "<gray>需要至少 <minimum> 名玩家</gray>"
  start-cancelled-actionbar: "<gray>等待更多玩家</gray> <dark_gray>·</dark_gray> <aqua><players>/<minimum></aqua>"
  start-title: "<gold><bold>行动开始</bold></gold>"
  start-subtitle: "<gray>寻找物资，活着撤离</gray>"
  start-actionbar: "<yellow>只有成功撤离，战利品才会进入你的物资仓库。</yellow>"

# 撤离区域反馈。进入区域开始倒计时，离开会取消。
extraction:
  started: "<green>正在从 <yellow><name></yellow> 撤离，请留在区域内。</green>"
  cancelled: "<red>你离开了撤离区域，撤离已取消。</red>"
  blocked: "<red>当前无法撤离:<reason></red>"
  completed: "<green><bold>撤离成功!</bold></green> <gray>本局战利品已安全带回物资仓库。</gray>"
  settlement-failed: "<yellow>物资暂时没有送回仓库，系统会自动重试。请留在当前服务器。</yellow>"
  settlement-conflict: "<red>本局已经按阵亡完成结算，无法再按撤离处理。请联系管理员检查服务器日志。</red>"
  authorization-failed: "<red>撤离条件校验失败:<reason>。你没有离开本局。</red>"

loot:
  title: "<gold>搜索物资</gold>"
  opened: "<gray>正在搜索附近的物资……物品会与本局玩家共享。</gray>"
  not-running: "<red>当前还不能搜索物资。</red>"
  deposit-blocked: "<yellow>这是公共物资箱，只能取出物品，不能存入物品。</yellow>"
  inventory-full: "<yellow>本局背包没有足够空间装下这件物资。</yellow>"
  taken: "<green>物资已放入本局背包。</green>"

inventory:
  loadout-loading: "<gray>正在领取你的出战装备……</gray>"
  loadout-retrying: "<yellow>物资服务暂时没有响应，系统会自动重试。请留在当前服务器。</yellow>"
  loadout-restore-retrying: "<yellow>出战装备尚未安全退回，系统会自动重试。请不要离开当前服务器。</yellow>"
  loadout-restored: "<red>部分出战装备无法在游戏中生成，本局已取消；原有装备已安全退回物资仓库。</red>"
  loadout-closed: "<red>本局物资已经完成结算，无法再次进入；正在返回大厅。</red>"

# 多房间聊天边界。普通聊天由房间自动分流；这些提示用于阻止原版聊天命令
# 绕过房间边界。管理员公告应从 Console 或代理层发送。
chat:
  cross-room-blocked: "<yellow>行动中只能联系同一房间的玩家。</yellow>"
  command-blocked: "<yellow>该聊天命令在行动中不可用，请使用普通聊天。</yellow>"
  room-action: "<dark_gray>[本局]</dark_gray> <gray>* <player> <message></gray>"

combat:
  friendly-fire-blocked: "<yellow>队伍友伤已关闭，你不能伤害队友。</yellow>"
  kill-confirmed: "<gold>击败 <yellow><victim></yellow>!</gold> <gray>本局击杀: <yellow><kills></yellow></gray>"
  kill-feed: "<dark_gray>[战斗]</dark_gray> <red><attacker></red> <gray>击败了</gray> <yellow><victim></yellow>"
  death-feed: "<dark_gray>[本局]</dark_gray> <yellow><victim></yellow> <gray>在行动中倒下了。</gray>"
  settlement-failed: "<red>死亡损失结算失败，暂时无法返回大厅。请联系管理员。</red>"

# ---------------------------------------------------------------------------
# 状态显示名:命令输出里的档案/对局状态(内部枚举 → 玩家可见中文)。
# ---------------------------------------------------------------------------
state:
  profile:
    loading: "<yellow>加载中</yellow>"
    ready: "<green>就绪</green>"
    failed: "<red>加载失败</red>"
  game:
    created: "已创建"
    waiting: "<green>等待中</green>"
    preparing: "准备中"
    starting: "<yellow>即将开始</yellow>"
    running: "<gold>进行中</gold>"
    ending: "结算中"
    finished: "已结束"
    destroyed: "已销毁"

# ---------------------------------------------------------------------------
# 地图显示名:键为 “map.<地图ID>”,未配置的地图回退为显示原始 ID。
# ---------------------------------------------------------------------------
map:
  debug_zone: "<yellow>调试区域</yellow>"
