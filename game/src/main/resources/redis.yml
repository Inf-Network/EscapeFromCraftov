# ============================================================================
#  RaidCoreGame Redis 配置(redis.yml)
#  Escape from Craftov · 逃离块科夫 —— 跨服务器通信设置
# ============================================================================
#
#  ◆ 本文件的作用
#    Redis 是整个游戏网络的"神经系统",游戏服务端通过它:
#      1. 发布本服实例目录快照(键 raidcore:servers:<服务器ID>,带 TTL 心跳,
#         大厅据此进行匹配);
#      2. 消费大厅写入的待入场分配(键 raidcore:pending:<玩家UUID>);
#      3. 订阅扩容提示频道(raidcore:provision),队列饥饿时立即补备实例。
#
#  ◆ Redis 挂了会怎样?
#    游戏服务端不会崩溃:相关操作降级为限流告警日志,Redis 恢复后自动继续。
#    但在此期间大厅无法把玩家匹配到本服。
#
#  ◆ 修改后需重启服务器生效。
# ============================================================================

redis:
  # Redis 服务器地址。类型:字符串。
  host: localhost

  # Redis 端口。类型:整数,默认 6379。
  port: 6379

  # Redis 密码。留空字符串表示无密码。类型:字符串。
  password: ""

  # Redis 数据库索引(SELECT n)。类型:整数,≥ 0,默认 0。
  # 同一个 Redis 实例上如有多套环境,可用不同索引隔离。
  database: 0

  # Jedis 连接池设置。一般保持默认即可。
  pool:
    # 池中最大连接数。类型:整数,必须 > 0。
    max-total: 8
    # 最大空闲连接数。类型:整数,必须 > 0。
    max-idle: 8
    # 最小空闲连接数。类型:整数,必须 > 0。
    min-idle: 1
