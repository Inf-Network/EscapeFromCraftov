Title: '&8地图对象属性'
Layout:
  - '####O####'
  - '#T A B C#'
  - '#D E    #'
  - '#P X    #'
  - '####Q####'
Options:
  Arguments: false
  Hide-Player-Inventory: true
  Min-Click-Delay: 150
Events:
  Open:
    - condition: 'perm *raid.editor'
      deny:
        - 'tell: &c你没有地图编辑权限。'
        - 'return'
Icons:
  '#':
    display: { material: black_stained_glass_pane, name: ' ' }
  O:
    display: { material: 'source:RAIDCOREEDITOR:summary' }
  T:
    display: { material: 'source:RAIDCOREEDITOR:toggle_enabled' }
    actions:
      all: [ 'reset', 'command: raid editor property toggle_enabled forward' ]
  A:
    display: { material: 'source:RAIDCOREEDITOR:slot_a' }
    actions:
      left: [ 'reset', 'command: raid editor property slot_a forward' ]
      right: [ 'reset', 'command: raid editor property slot_a reverse' ]
  B:
    display: { material: 'source:RAIDCOREEDITOR:slot_b' }
    actions:
      left: [ 'reset', 'command: raid editor property slot_b forward' ]
      right: [ 'reset', 'command: raid editor property slot_b reverse' ]
  C:
    display: { material: 'source:RAIDCOREEDITOR:slot_c' }
    actions:
      left: [ 'reset', 'command: raid editor property slot_c forward' ]
      right: [ 'reset', 'command: raid editor property slot_c reverse' ]
  D:
    display: { material: 'source:RAIDCOREEDITOR:slot_d' }
    actions:
      left: [ 'reset', 'command: raid editor property slot_d forward' ]
      right: [ 'reset', 'command: raid editor property slot_d reverse' ]
  E:
    display: { material: 'source:RAIDCOREEDITOR:slot_e' }
    actions:
      left: [ 'reset', 'command: raid editor property slot_e forward' ]
      right: [ 'reset', 'command: raid editor property slot_e reverse' ]
  P:
    display: { material: 'source:RAIDCOREEDITOR:teleport' }
    actions: { all: 'command: raid editor property teleport forward' }
  X:
    display: { material: 'source:RAIDCOREEDITOR:delete' }
    actions: { all: 'command: raid editor property delete forward' }
  Q:
    display: { material: barrier, name: '&c关闭', lore: [ '&7返回地图编辑世界' ] }
    actions: { all: close }
