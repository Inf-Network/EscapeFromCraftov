# ============================================================================
#  RaidCoreLobby 主配置(config.yml)
#  Escape from Craftov · 逃离块科夫 —— 大厅插件核心设置
# ============================================================================
#
#  ◆ 本文件的作用
#    大厅的匹配节奏、保护开关与默认地图都在这里配置。
#    修改后需重启服务器生效。
# ============================================================================

# ---------------------------------------------------------------------------
# 匹配队列。
# ---------------------------------------------------------------------------
queue:
  # 匹配轮询间隔(秒):每隔这么久扫描一次实例目录并分配队首玩家。
  # 类型:整数,必须 > 0。调小匹配更快,Redis 读取更频繁。
  tick-seconds: 1

  # 席位预留时长(秒):派单后为玩家在目标实例预占的名额有效期,
  # 防止两次目录快照之间同一实例被超卖。类型:整数,必须 > 0。
  # 建议 ≥ 跨服传送 + 快照刷新所需时间。
  reservation-ttl-seconds: 30

  # 匹配分配键(raidcore:pending:<玩家UUID>)的 Redis TTL(秒)。
  # 玩家必须在此时间内到达游戏服务端,过期视为放弃。类型:整数,必须 > 0。
  assignment-ttl-seconds: 30

# ---------------------------------------------------------------------------
# 大厅行为。
# ---------------------------------------------------------------------------
lobby:
  # 大厅保护。类型:布尔。true 时禁止破坏/放置方块、玩家受伤、饥饿消耗、
  # 丢弃物品与移动背包物品(管理员 raid.admin + 创造模式除外)。
  protect: true

  # /play 不带参数与主菜单"开始游戏"使用的默认地图 ID。类型:字符串,
  # 格式 [a-z0-9_]+。显示名在 messages.yml 的 map 节配置。
  default-map: debug_zone

  # Lobby 常驻地图列表。默认地图必须包含在内；/play <地图> 的 Tab 候选还会
  # 自动合并在线 Game 房间实际公布的地图。新导入地图创建首个房间后即可被
  # 动态发现；需要一直显示或作为默认地图时，再把它写入这里。
  enabled-maps:
    - debug_zone

# 大厅动态 Sidebar。只更新内容，不反复重建 Scoreboard。
scoreboard:
  enabled: true
  # 右侧信息和 Tab 页脚刷新间隔，20 tick = 1 秒。
  refresh-ticks: 20
  # 仓库/出战栏统计异步刷新间隔，避免频繁查询 PostgreSQL。
  inventory-refresh-seconds: 5

# ---------------------------------------------------------------------------
# 跨服 Redis。Lobby 与全部 Game 服务端的地址、密码和 database 必须一致。
# ---------------------------------------------------------------------------
redis:
  host: localhost
  port: 6379
  password: ""
  database: 0
  pool:
    max-total: 8
    max-idle: 8
    min-idle: 1

# ---------------------------------------------------------------------------
# PostgreSQL 持久化。Lobby 与 Game 必须连接同一数据库；等级、余额、玩家设置
# 与装扮均以 PostgreSQL 为唯一事实来源。数据库不可用时 Lobby 拒绝启动。
# ---------------------------------------------------------------------------
database:
  # PostgreSQL 地址、端口与数据库名。Lobby 与 Game 必须连接同一个库。
  host: localhost
  port: 5432
  database: raidcore

  # 建议使用 RaidCore 专用低权限账号。
  username: raidcore
  password: change-me

  # PostgreSQL schema。Lobby 与 Game 必须一致；默认 public。
  schema: public

  # PostgreSQL JDBC sslmode: disable / allow / prefer / require /
  # verify-ca / verify-full。公网数据库建议 verify-full。
  ssl-mode: prefer
  # 写入 pg_stat_activity，便于区分连接来自 Lobby 还是 Game。
  application-name: RaidCoreLobby
  # 保持 TCP 连接活性，并让驱动把批量 INSERT 改写成多值写入。
  tcp-keepalive: true
  rewrite-batched-inserts: true
  # 建立 TCP 连接的最大秒数，1 ~ 300。
  connect-timeout-seconds: 10
  # 已建立连接的网络读取超时秒数；0 表示无限。有限值可避免半断开卡死。
  socket-timeout-seconds: 30

  # HikariCP 连接池。全部时间单位均为毫秒。
  pool:
    # 单台 Lobby 最大数据库连接数；需要与全部 Game 服合计规划 PostgreSQL 上限。
    maximum-pool-size: 10
    # 常驻空闲连接，允许为 0，不能超过 maximum-pool-size。
    minimum-idle: 2
    # 从连接池借连接的最长等待毫秒数，最小 250。
    connection-timeout: 10000
    # JDBC isValid 校验超时，最小 250 且必须小于 connection-timeout。
    validation-timeout: 5000
    # 空闲连接回收时间；0 禁用，非 0 最小 10000。
    idle-timeout: 600000
    # 物理连接最长生命周期；建议略短于数据库或中间代理的连接上限。
    max-lifetime: 1800000
    # 空闲连接保活间隔；0 禁用，非 0 必须小于 max-lifetime。
    keepalive-time: 120000
    # 连接泄漏检测；0 禁用，排障时可临时设置为 >= 2000。
    leak-detection-threshold: 0
    # 正数=启动建池失败即中止；0=尝试一次后可继续；负数=跳过启动校验。
    # Lobby 强依赖 PostgreSQL，生产推荐正数。
    initialization-fail-timeout: 1
    # ORM 事务隔离级别。
    transaction-isolation: TRANSACTION_READ_COMMITTED
    # 新物理连接建立后执行的 SQL；空字符串不执行。
    # 示例:"SET statement_timeout = '15s'"。
    connection-init-sql: ""
    # autoCommit=false 时隔离 Hikari 自身校验事务。
    isolate-internal-queries: true
    # 是否通过 JMX 暴露连接池指标。
    register-mbeans: false

  # Hibernate ORM。首次部署可用 update；结构稳定后建议切换 validate。
  # create/create-drop 会重建/删除表，生产环境严禁使用。
  orm:
    schema-action: update
    # JDBC 写入批大小；0 禁用。与 rewrite-batched-inserts 配合使用。
    statement-batch-size: 25
    # 延迟关联批量抓取大小；0 禁用。
    default-batch-fetch-size: 16
    # SQL 输出仅供开发排障，生产保持 false。
    show-sql: false
    format-sql: false
    # Hibernate 性能统计有额外开销，仅诊断时临时开启。
    generate-statistics: false
