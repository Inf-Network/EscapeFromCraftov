# ============================================================================
#  EscapeFromCraftovLobby 消息配置(messages.yml)
#  Escape from Craftov · 逃离块科夫 —— 大厅插件的全部玩家可见文本
# ============================================================================
#
#  ◆ 本文件的作用
#    大厅插件发送给玩家的每一条消息、菜单标题、物品名称与说明文字都定义在
#    这里。修改保存后重启服务器生效(本插件不提供热重载)。
#
#  ◆ MiniMessage 语法速览(所有值都使用 MiniMessage 格式,禁止使用 § 颜色码)
#    <gray>文字</gray>          灰色文字(正文默认色)
#    <gold><bold>文字</bold></gold>   金色加粗(标题/强调)
#    <green>/<red>/<yellow>    成功 / 错误 / 高亮
#    <newline>                 换行(用于 Tab 头等多行文本)
#    <占位符>                  由插件运行时填充,详见每条消息旁的注释;
#                              删除占位符不会报错,但对应信息将不再显示
#
#  ◆ 菜单物品的 lore(说明文字)约定
#    lore 值中的竖线 “|” 表示换行,例如 "第一行|第二行" 会渲染成两行灰色说明。
#
#  ◆ 风格约定(Hypixel 式)
#    正文灰色、重点金黄、成功绿色、错误红色;游戏流程消息不带前缀,
#    prefix 仅用于管理命令输出。
# ============================================================================

# 管理/调试命令输出的前缀(游戏流程消息不使用)。
prefix: "<gold>Craftov</gold> <dark_gray>»</dark_gray> "

# ---------------------------------------------------------------------------
# Tab 列表页眉/页脚:玩家按 Tab 时顶部与底部显示的品牌横幅。
# 页眉为两行:拉丁大标题 + 中文副标题。页脚一般放服务器地址。
# ---------------------------------------------------------------------------
tab:
  header: "<gold><bold>ESCAPE FROM CRAFTOV</bold></gold><newline><gray>逃离块科夫</gray>"
  footer: "<gray>play.example.com</gray>"

# ---------------------------------------------------------------------------
# 进入大厅时的欢迎语。
# ---------------------------------------------------------------------------
join:
  welcome: "<gray>欢迎来到</gray> <gold><bold>Escape from Craftov</bold></gold> <gray>·</gray> <yellow>逃离块科夫</yellow>"
  data-failed: "<red>无法读取你的个人资料。请稍后重试;若问题持续,请联系管理员。</red>"

# ---------------------------------------------------------------------------
# 大厅物品:热键栏第 5 格的“游戏菜单”指南针名称(右键打开主菜单)。
# ---------------------------------------------------------------------------
lobby:
  compass-name: "<green>游戏菜单</green> <gray>(右键打开)</gray>"

# ---------------------------------------------------------------------------
# 匹配队列消息。
#   joined       加入队列成功;<map> = 地图显示名(见文件底部 map 节)
#   waiting      排队等待中的周期性提示(可在“设置”菜单中关闭)
#   match-found  匹配成功即将跨服传送;<server> = 目标服务器名
# ---------------------------------------------------------------------------
queue:
  data-loading: "<yellow>正在读取你的个人资料,请稍候……</yellow>"
  joined: "<gray>你已加入 <yellow><map></yellow> 的匹配队列。</gray>"
  already-queued: "<red>你已经在匹配队列中了。</red>"
  left: "<gray>你已离开匹配队列。</gray>"
  not-queued: "<red>你当前不在匹配队列中。</red>"
  waiting: "<gray>正在为你寻找可用的对局……</gray>"
  match-found: "<green>匹配成功!正在将你传送至 <yellow><server></yellow>……</green>"

# ---------------------------------------------------------------------------
# 设置开关反馈;<setting> = 设置项名称(取自下方菜单配置)。
# ---------------------------------------------------------------------------
settings:
  toggled-on: "<gray><setting></gray> <green>已开启!</green>"
  toggled-off: "<gray><setting></gray> <red>已关闭。</red>"

# ---------------------------------------------------------------------------
# 装扮反馈;<cosmetic> = 装扮名称。
# ---------------------------------------------------------------------------
cosmetics:
  equipped: "<green>已装备</green> <gold><cosmetic></gold><green>!</green>"
  unequipped: "<gray>已卸下装扮。</gray>"

# ---------------------------------------------------------------------------
# 命令通用错误。
#   invalid-map  /play 输入了不合法的地图 ID;<map> = 玩家输入的原文
# ---------------------------------------------------------------------------
command:
  no-permission: "<red>你没有权限这么做。</red>"
  player-only: "<red>该命令只能由玩家使用。</red>"
  invalid-map: "<red>未知的地图:<map></red>"
  checking-map: "<gray>正在查找地图 <yellow><map></yellow> 的可用房间……</gray>"
  map-check-failed: "<red>暂时无法读取可用地图，请稍后再试。</red>"

# ---------------------------------------------------------------------------
# 菜单文本。
#   *.title  菜单标题(纯文本即可,也支持 MiniMessage)
#   *.name   物品名称;*.lore 物品说明(“|” 换行);*.hint 黄色操作提示
#   settings.state-on / state-off  开关当前状态行
#   back / close  通用“返回 / 关闭”按钮名称
# ---------------------------------------------------------------------------
menu:
  action-failed: "<red>操作没有完成，请稍后再试。</red>"
  main:
    title: "大厅菜单"
    play:
      name: "<gold>开始游戏</gold>"
      lore: "<gray>排队进入一场</gray>|<gray>块科夫战场行动。</gray>"
      hint: "<yellow>点击开始匹配!</yellow>"
    settings:
      name: "<gold>设置</gold>"
      lore: "<gray>调整你的大厅体验。</gray>"
      hint: "<yellow>点击打开!</yellow>"
    cosmetics:
      name: "<gold>装扮</gold>"
      lore: "<gray>在大厅中脱颖而出。</gray>"
      hint: "<yellow>点击浏览!</yellow>"
    warehouse:
      name: "<gold>物资仓库与出战</gold>"
      lore: "<gray>整理你成功带回的战利品。</gray>|<gray>选择下一局要带的装备。</gray>"
      hint: "<yellow>点击打开!</yellow>"
  settings:
    title: "设置"
    lobby_player_visibility:
      name: "<gold>大厅玩家可见性</gold>"
      lore: "<gray>显示或隐藏大厅中的其他玩家。</gray>"
    queue_status_messages:
      name: "<gold>排队状态提示</gold>"
      lore: "<gray>排队等待时的周期性进度提示。</gray>"
    state-on: "<green>已开启</green>"
    state-off: "<red>已关闭</red>"
    hint: "<yellow>点击切换!</yellow>"
  cosmetics:
    title: "装扮"
    equipped: "<green>当前已装备</green>"
    hint: "<yellow>点击装备!</yellow>"
    unequip:
      name: "<red>卸下装扮</red>"
      lore: "<gray>摘下当前佩戴的装扮。</gray>"
      hint: "<yellow>点击卸下!</yellow>"
  back: "<yellow>« 返回</yellow>"
  close: "<red>关闭</red>"
  warehouse:
    title: "物资仓库与出战"
    previous: "<yellow>上一页</yellow>"
    next: "<yellow>下一页</yellow>"
    info: "<gray>第 <yellow><page></yellow>/<yellow><pages></yellow> 页</gray>"
    move-failed: "<red>物品移动失败，请稍后再试。</red>"
    load-failed: "<red>物资仓库暂时无法打开，请稍后再试。</red>"
    equipped: "<green>已放入出战栏。</green>"
    stored: "<gray>已放回物资仓库。</gray>"

# ---------------------------------------------------------------------------
# 地图显示名:键为 “map.<地图ID>”。/play 与队列消息中的 <map> 会优先取
# 这里的显示名,未配置的地图回退为显示原始 ID。
# ---------------------------------------------------------------------------
map:
  debug_zone: "<yellow>调试区域</yellow>"
