Title: '&8外观收藏'
Layout:
  - '#########'
  - '#A B C D#'
  - '###U#R###'
Options:
  Arguments: false
  Hide-Player-Inventory: true
  Min-Click-Delay: 150
Icons:
  '#':
    display: { material: black_stained_glass_pane, name: ' ' }
  A:
    display: { material: 'source:CRAFTOVCORELOBBY:cosmetic-0' }
    actions: { all: [ 'reset', 'command: lobby cosmetic equip 0' ] }
  B:
    display: { material: 'source:CRAFTOVCORELOBBY:cosmetic-1' }
    actions: { all: [ 'reset', 'command: lobby cosmetic equip 1' ] }
  C:
    display: { material: 'source:CRAFTOVCORELOBBY:cosmetic-2' }
    actions: { all: [ 'reset', 'command: lobby cosmetic equip 2' ] }
  D:
    display: { material: 'source:CRAFTOVCORELOBBY:cosmetic-3' }
    actions: { all: [ 'reset', 'command: lobby cosmetic equip 3' ] }
  U:
    display: { material: barrier, name: '&c卸下当前外观', lore: [ '&7恢复默认外观' ] }
    actions: { all: [ 'reset', 'command: lobby cosmetic unequip' ] }
  R:
    display: { material: arrow, name: '&e返回主菜单' }
    actions: { all: [ 'reset', 'command: lobby' ] }

