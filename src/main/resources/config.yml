# Craftov configuration. Values marked (s) are seconds.

# New players receive this once. Loadout keys are inventory slots:
# 0-7 hotbar, 9-17 chest rig cells, 18-35 backpack cells, 36 backpack, 37 rig, 38 body armor, 39 helmet.
# Format: item[:amount[:ammo for guns]]
starter:
  money: 150000
  loadout:
    '0': "k47:1:ammo_762_ps"
    '1': "p18:1:ammo_9_fmj"
    '2': "medkit_s"
    '3': "bandage:2"
    '9': "ammo_762_ps:60"
    '10': "ammo_9_fmj:34"
    '36': "pack_1"
    '37': "rig_1"
    '38': "armor_2"
    '39': "helmet_2"
  stash:
    - "sv9"
    - "ammo_9_fmj:60"
    - "ammo_9_fmj:60"
    - "splint"
    - "hemostat"
    - "frag"
    - "smoke"
    - "helmet_1"
    - "armor_1"

# Free basic kit for players whose loadout is nearly worthless (claimed from the main menu).
free-kit:
  max-value: 15000
  cooldown-minutes: 20
  items:
    - "p18:1:ammo_9_fmj"
    - "ammo_9_fmj:51"
    - "sv9:1:ammo_9_fmj"
    - "ammo_9_fmj:60"
    - "armor_1"
    - "helmet_1"
    - "rig_1"
    - "bandage:2"
    - "medkit_s"

# Difficulty tiers shown in the deploy menu (first entry is the default).
tiers:
  NORMAL:
    name: "常规"
    color: "#5BD16B"
    min-value: 0
    loot-shift: 0
    ai-count: 0.8
    ai-accuracy: 0.55
    ai-gear: 0
    boss: false
    xp: 1.0
  CONFIDENTIAL:
    name: "机密"
    color: "#4FA3FF"
    min-value: 60000
    loot-shift: 1
    ai-count: 1.0
    ai-accuracy: 0.75
    ai-gear: 1
    boss: true
    xp: 1.5
  SECRET:
    name: "绝密"
    color: "#FF4D4D"
    min-value: 250000
    loot-shift: 2
    ai-count: 1.25
    ai-accuracy: 0.95
    ai-gear: 2
    boss: true
    xp: 2.2

match:
  # Wait at most this long (s) for more players before launching with whoever is queued.
  wait-seconds: 15
  max-squads: 4
  max-solo-players: 8

raid:
  # A disconnected player can rejoin the raid within this window (s); afterwards they are missing in action.
  reconnect-seconds: 120

downed:
  # Bleed-out time (s) of the first and second knock-down. A third lethal hit kills.
  first-seconds: 60
  second-seconds: 30
  revive-seconds: 5
  max-downs: 2
  # Allow knock-downs in solo raids (no teammate can revive, only the self-revive injector).
  solo: false

combat:
  friendly-fire: false
  damage-numbers: true

ai:
  # Chance of a rival operator squad per raid, by difficulty (常规, 机密, 绝密); they appear after the delay.
  operator-chance: [0.15, 0.35, 0.5]
  operator-delay-seconds: 60
  count-multiplier: 1.0
  # Soldiers ignore freshly inserted players for this many ticks (20 ticks = 1 s).
  insertion-grace-ticks: 240
  damage-multiplier: 0.65
  reaction-ticks: 14

trader:
  buy-multiplier: 1.15
  sell-multiplier: 0.55
  # Rarest tier the trader sells (GOLD and RED only come from raids and the market).
  max-rarity: PURPLE

market:
  listing-hours: 48
  listing-fee: 0.02
  sale-tax: 0.05
  max-listings: 12
  # Simulated buyers purchase listings priced near the reference price, so the market works on small servers.
  virtual-buyers: true
  virtual-min-age-seconds: 45
  reference-multiplier: 0.85

rank:
  min-level: 3

tasks:
  # Cost of swapping an unfinished daily contract, and the bonus for finishing all three.
  reroll-cost: 3000
  all-done-bonus: 20000

escort:
  # Share of the reward paid to escorts when the client dies.
  failure-share: 0.3

events:
  # Share of raids fought at night (dark; soldiers see half as far but spot lit tactical lights from afar).
  night-chance: 0.3
  # Maps that are always played in daylight (test maps).
  day-only-maps: [proving]
  # Random events per raid: blackout, barrage, reinforcements, supply drop, boss patrol.
  per-raid: 2
  blackout-seconds: 180

replay:
  # After being killed, watch the last six seconds again through the killer's eyes (Shift skips).
  enabled: true

cinematic:
  enabled: true

hud:
  # Use BetterHud when installed (HUD layout is installed automatically).
  betterhud: true
  # Keep the boss-bar HUD even when BetterHud is active.
  vanilla-bars-with-betterhud: false

pack:
  # Rebuild the CraftEngine pack automatically after Craftov updates its resources.
  auto-reload: true

search:
  # Seconds to reveal one item of each rarity. The same everywhere: containers never change it.
  seconds:
    WHITE: 0.6
    GREEN: 0.9
    BLUE: 1.3
    PURPLE: 1.9
    GOLD: 2.6
    RED: 3.6

test:
  # Test mode: every player can open the item catalog (/cv items, also in the terminal) to take any item
  # for free, top up money and reset health. Admins (craftov.admin) can always use it. Keep off on live servers.
  enabled: false
