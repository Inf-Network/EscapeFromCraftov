# Craftov configuration. Values marked (s) are seconds.

# New players receive this once. Loadout keys are inventory slots:
# 0-7 hotbar, 9-17 chest rig cells, 18-35 backpack cells, 36 backpack, 37 rig, 38 body armor, 39 helmet.
# Format: item[:amount[:ammo for guns]]
starter:
  money: 150000
  loadout:
    '0': "k47:1:ammo_762_ps"
    '1': "p18:1:ammo_9_fmj"
    '2': "medkit_s"
    '3': "bandage:2"
    '9': "ammo_762_ps:60"
    '10': "ammo_9_fmj:34"
    '36': "pack_1"
    '37': "rig_1"
    '38': "armor_2"
    '39': "helmet_2"
  stash:
    - "sv9"
    - "ammo_9_fmj:60"
    - "ammo_9_fmj:60"
    - "splint"
    - "hemostat"
    - "frag"
    - "smoke"
    - "helmet_1"
    - "armor_1"

# Free basic kit for players whose loadout is nearly worthless (claimed from the main menu).
# max-value caps their gear value (what they carry, the melee weapon left out, as the HUD shows it);
# max-assets caps everything they own at item value (money, stash, mailbox, carried gear with the
# knife, secure container, market listings and an escrowed escort reward).
free-kit:
  max-value: 15000
  max-assets: 200000
  cooldown-minutes: 20
  items:
    - "p18:1:ammo_9_fmj"
    - "ammo_9_fmj:51"
    - "sv9:1:ammo_9_fmj"
    - "ammo_9_fmj:60"
    - "armor_1"
    - "helmet_1"
    - "rig_1"
    - "bandage:2"
    - "medkit_s"

# Difficulty tiers shown in the deploy menu (first entry is the default).
# min-value is the gear value (战备值) every squad member needs to queue: what they carry, without
# the melee slot or any melee weapon, which is never lost and so puts nothing at stake.
# loot-shift is where every loot roll of the raid starts; a container's tier on the map (and the
# boss, supply drops) add to it, never above max-shift (loot.yml shift-bonus says what a shift does).
# entry-fee is charged on deploy (checked when queueing). A server config.yml without max-shift or
# entry-fee takes them from the plugin's own config.yml for the same tier (one shift above
# loot-shift, at most 2, and no fee for a tier the plugin does not ship).
tiers:
  NORMAL:
    name: "常规"
    color: "#5BD16B"
    min-value: 0
    entry-fee: 0
    loot-shift: 0
    max-shift: 1
    ai-count: 0.8
    ai-accuracy: 0.55
    ai-gear: 0
    boss: false
    xp: 1.0
  CONFIDENTIAL:
    name: "机密"
    color: "#4FA3FF"
    min-value: 60000
    entry-fee: 8000
    loot-shift: 1
    max-shift: 2
    ai-count: 1.0
    ai-accuracy: 0.75
    ai-gear: 1
    boss: true
    xp: 1.5
  SECRET:
    name: "绝密"
    color: "#FF4D4D"
    min-value: 250000
    entry-fee: 20000
    loot-shift: 2
    max-shift: 2
    ai-count: 1.25
    ai-accuracy: 0.95
    ai-gear: 2
    boss: true
    xp: 2.2

match:
  # One pool per map and difficulty (ranked or not). A raid launches as soon as it has max-squads squads,
  # or once the longest-waiting player has waited wait-seconds, with everyone queued by then. Extra squads
  # launch the next raid. Nobody joins a raid after it starts.
  wait-seconds: 30
  # Squads per raid; never more than the map has spawn groups (试验场 4, 锈港 6).
  max-squads: 4

raid:
  # A disconnected player can rejoin the raid within this window (s); afterwards they are missing in action.
  reconnect-seconds: 120

downed:
  # Bleed-out time (s) of the first and second knock-down. A third lethal hit kills.
  first-seconds: 60
  second-seconds: 30
  revive-seconds: 5
  # A teammate revives by holding right click on the downed player: within revive-range blocks,
  # feet less than revive-max-height apart (a stair or a slab, not a ledge or the floor above), and
  # with a clear line from their eyes to the downed player.
  revive-range: 2.2
  revive-max-height: 1.0
  # The revive starts over when the reviver walks more than this many blocks from where they began,
  # or takes damage (their own bleeding aside).
  revive-max-move: 0.5
  # A lethal hit knocks a player down (below max-downs) while a squadmate is still up to revive
  # them, or while they carry a self-revive injector: solo, or the last of the squad standing, they
  # then bleed out as usual and can use it. Without either, the hit kills.
  max-downs: 2

medical:
  # Healing pool a medkit or surgery kit (items.yml med.pool) uses up per wound it treats; what is
  # left heals, up to the item's per-use amount. Bandages, hemostats and splints are used up whole.
  wound-cost: { LIGHT_BLEED: 15, HEAVY_BLEED: 40, FRACTURE: 40 }

stamina:
  # Stamina runs from 0 to 100. Sprinting drains sprint-drain a tick and a jump costs jump-cost,
  # both times the load factor below; after 0.75 s without either it comes back at regen a tick
  # (regen-sneaking while sneaking). At 0 sprinting stops until it is back at 30. With these
  # numbers a full bar lasts about 17 s of sprinting and takes about 13 s to refill.
  sprint-drain: 0.3
  jump-cost: 5
  regen: 0.4
  regen-sneaking: 0.5
  # Load (kg, items.yml weight). Above comfort-kg every kilogram slows by penalty-per-kg and drains
  # stamina 1/30 faster. Above overload-kg sprinting is impossible and every further kilogram slows
  # by overload-penalty-per-kg. The slowdown never goes past max-penalty.
  comfort-kg: 25
  overload-kg: 40
  penalty-per-kg: 0.01
  overload-penalty-per-kg: 0.025
  max-penalty: 0.5

combat:
  friendly-fire: false
  damage-numbers: true
  flashbang:
    # A flashed player's screen goes white (then fades) and their ears ring: facing-ticks when they
    # looked at the blast, away-ticks when it was behind them, never less than min-ticks. No effect
    # through walls. Soldiers are dazzled instead (ai.dazzle).
    facing-ticks: 80
    away-ticks: 30
    min-ticks: 20
    # Share of a flashbang's effect left at the edge of its radius (full strength at the blast).
    edge-strength: 0.4
    # Also blind the player while the screen is fully white. The white is a camera overlay, which the
    # client only draws in first person with the HUD shown, so without this a flashed player could
    # press F5 (or F1) and see clearly; with it they see blindness fog there (it closes in over about
    # a second). In first person the opaque white hides the fog, and the effect is lifted before the
    # white starts to fade. Blindness also stops sprinting meanwhile.
    blind-while-white: true
  penetration:
    # Glass in a raid (not tinted glass) shatters under any round, which flies on with this share of
    # its damage. A round goes on through at most two layers (a pane, a door, a plank wall...).
    glass-damage: 0.9
    # Blocks with the same rule below that a round goes from one straight into the next count as one
    # layer, paid for once: a plank wall shot at an angle takes the round out of one plank through its
    # side into the next. Only while the path through the layer is at most this many blocks long: a
    # 1-block wall goes through up to about 55 degrees off square, and two walls back to back (2 deep)
    # never do.
    layer-depth: 1.8
    # Blocks a round goes through. It needs at least `level` penetration left (the ammo's `pen` in
    # items.yml), uses that much up and keeps `damage` of its damage: a common rifle round (pen 3) goes
    # through one wooden door or one layer of planks, not two, and 9x19 FMJ (pen 1) through none.
    # Armour still meets the round's full pen. Keys are block ids, `*` standing for any part of one,
    # or `#tag` for a block tag; the first key that matches a block counts. Every other block stops a
    # round: stone, metal doors and tinted glass stay bulletproof. The glass panes here only count
    # outside raids, where glass does not shatter.
    blocks:
      glass_pane: { level: 1, damage: 0.9 }
      "*_stained_glass_pane": { level: 1, damage: 0.9 }
      iron_bars: { level: 1, damage: 0.85 }
      "#leaves": { level: 1, damage: 0.85 }
      "#wooden_trapdoors": { level: 2, damage: 0.75 }
      "#wooden_doors": { level: 2, damage: 0.7 }
      "#planks": { level: 3, damage: 0.6 }
  lag-compensation:
    # A player's shots meet everyone where that player's screen showed them: hitboxes as they were
    # ping + extra-ms ago (the ping Paper reports is the round trip), at most max-ms. The extra covers
    # the client's smoothing of other players and soldiers (3 ticks behind the updates), how far the
    # server has moved them on since the last update, drawing between ticks and the shot waiting for
    # the next server tick: about 200 ms in all. The cost: someone who has just stepped behind cover can still be hit for up to
    # max-ms. max-ms above 1000 counts as 1000 (the history kept goes back no further). Soldiers'
    # shots are never rewound.
    enabled: true
    extra-ms: 200
    max-ms: 300
  # Bullet and knife damage multiplier by where it lands (head hits use the weapon's own head
  # multiplier: 2.0 for a gun and 1.0 for a knife unless items.yml says otherwise; knives take
  # combat.melee.zone-multipliers on the arms and legs). Arms and legs share the one 100-point health
  # pool with the torso and are about half the hitbox (legs alone 40%), and no armour covers them:
  # lowering arm and leg (0.5 each makes a K47 with PS need six leg hits instead of four) is the
  # short-term way to keep limb shots from downing a player in any armour.
  zone-multipliers:
    chest: 1.0
    stomach: 0.95
    arm: 0.65
    leg: 0.7
  # Helmets cover the head, vests the chest and stomach, against bullets and knives alike (a knife
  # is a round with its own damage, pen and armor-damage from items.yml).
  armor:
    # Share of a hit's damage that gets through armour at full strength, by the round's penetration
    # minus the armour's class: +1 or more, 0, -1, -2, -3 or less (the first and last entries also
    # cover everything beyond them). Armour always takes something off, even against a stronger round.
    damage-taken: [0.85, 0.6, 0.4, 0.25, 0.15]
    # Armour protects fully above this share of its durability; below it, its protection fades
    # linearly to none at 0. The part of a hit that wears more durability than is left goes straight
    # through. A round the class stops can still make the chest or stomach bleed through a vest
    # below full strength, with the chance growing as the protection fades.
    full-protection-above: 0.5
    # Durability a hit wears off: the round's damage (after range falloff, before the hit zone) x its
    # armor-damage x this; wear-blocked when the class stops the round, wear-penetrated when it does
    # not. The engineer's passive takes a quarter off.
    wear-blocked: 0.3
    wear-penetrated: 0.3
  melee:
    # Knife damage multiplier on the arms and legs, in place of zone-multipliers (the chest and
    # stomach are the same as for a bullet). No armour covers the limbs: at a bullet's 0.65 / 0.7 the
    # machete (52) downed a player in any armour with three limb cuts; at 0.6 it takes four, as many
    # as a K47 with PS takes in the legs. tools/combat/melee.py prints and checks the hits.
    zone-multipliers:
      arm: 0.6
      leg: 0.6

weapons:
  # Guns do not fire while sprinting, nor for this many ticks after the sprint ends (the gun coming
  # back up). A trigger held through it fires as soon as it is over.
  sprint-recovery-ticks: 5
  # Ticks a gun takes to come up once it is in the hand (switched to, or after a revive), by its
  # action in items.yml. Until then it neither fires nor aims; a trigger pulled meanwhile and still
  # held fires as soon as the gun is up. Switching away and back never skips the bolt or pump cycle.
  draw-ticks:
    pistol: 6
    pistol_heavy: 6
    smg: 10
    pdw: 10
    ak: 12
    ar: 12
    dmr: 12
    pump: 14
    lmg: 18
    bolt: 18
  spread:
    # Moving widens the cone (bloom included) by 1 + move × how close the player is to their full
    # walking pace (measured on the server, 0 standing .. 1 walking or faster): hip fire and aiming.
    move-hip: 0.5
    move-ads: 1.0
    # Multipliers of the gun's base spread while sneaking and while off the ground.
    sneak: 0.7
    airborne: 2.5
  recoil:
    # Recovery: this many ticks after the gun stops firing (plus the player's round trip), the camera
    # drifts back toward where the spray began, return-per-tick (0..1, 0 = no recovery) of the kick
    # each tick, until the gun's recoil-return share (items.yml, default 0.7) is given back. What the
    # player pulled down themselves is not given back again, and it never drifts past the crosshair
    # the spray started from.
    return-delay-ticks: 3
    return-per-tick: 0.1
    # In full-auto and burst fire this share of every kick lifts only the bullets, not the camera. The
    # camera kick is a packet the client could ignore; this part cannot be. Each round lifts them less
    # the higher they already are: muzzle-soft is the climb (degrees) at which a round's lift has
    # halved, so an M4C spray aimed down the sights is about 0.6 degrees above the crosshair at round 10
    # and 1.4 at round 30, still creeping up. muzzle-max is a hard ceiling no magazine reaches.
    # It comes back to the crosshair over muzzle-return-ticks once the camera starts drifting back.
    # Single shots (semi, bolt, pump) are not lifted.
    muzzle-share: 0.2
    muzzle-soft: 0.5
    muzzle-max: 6.0
    muzzle-return-ticks: 6

ai:
  # Chance of a rival operator squad per raid, by difficulty (常规, 机密, 绝密); they appear after the delay.
  operator-chance: [0.15, 0.35, 0.5]
  operator-delay-seconds: 60
  count-multiplier: 1.0
  # Soldiers ignore freshly inserted players for this many ticks (20 ticks = 1 s).
  insertion-grace-ticks: 240
  damage-multiplier: 0.65
  reaction-ticks: 14
  # A strobe light in the face (and flashbangs) dazzle soldiers instead of freezing them: they keep
  # moving and shooting back, but their next shot waits shot-delay-ticks and their spread is multiplied
  # until the dazzle ends. Then a strobe cannot dazzle them again for immune-ticks.
  dazzle:
    strobe-ticks: 20
    spread-multiplier: 3.0
    shot-delay-ticks: 10
    immune-ticks: 80
    # Flashbang: dazzle length when the soldier faces the blast or has it behind them, scaled down
    # with distance (combat.flashbang.edge-strength). No effect through walls; ignores immune-ticks.
    flash-facing-ticks: 40
    flash-away-ticks: 15

trader:
  buy-multiplier: 1.15
  sell-multiplier: 0.55
  # Share of an armour piece's value charged per full bar of missing durability. Repairing raises
  # the value by 0.75 of it, and the market's system buyers pay at most market.virtual-max-value of
  # value (~0.65 after fee and tax; they judge listings by item value, never by past sales), so below
  # ~0.49 repairing worn armour to sell it would be profit (tools/econ/repair.py checks).
  repair-rate: 0.75
  # Rarest tier the trader sells (GOLD and RED only come from raids and the market).
  max-rarity: PURPLE

market:
  listing-hours: 48
  listing-fee: 0.02
  sale-tax: 0.05
  max-listings: 12
  # Simulated buyers take cheap listings, so the market works on small servers. They are a quick
  # outlet a little better than the trader, not a buyer at full price: they pay at most
  # virtual-max-value x the item's value (durability, attachments, loaded ammo and stack size
  # included; ~0.65 after fee and tax against the trader's 0.55), nothing rarer than
  # virtual-max-rarity, and at most virtual-daily-cap listings of one item per seller per day
  # (04:00 reset; per seller, so one player cannot use it up for everyone else; 0 = no cap). Each
  # round (10 s) a listing at up to 85% / 93% / 100% of their price sells with chance 0.3 / 0.12 /
  # 0.04, so one at their full price takes about four minutes.
  virtual-buyers: true
  virtual-min-age-seconds: 45
  virtual-max-value: 0.7
  virtual-max-rarity: PURPLE
  virtual-daily-cap: 10
  # Reference price = item value (durability, attachments, loaded ammo and stack size included) x this.
  # It is fixed by items.yml: the pricing screen and the trade-price band judge listings against it,
  # and no sale moves it.
  reference-multiplier: 0.85
  # Listings priced above this multiple of the reference price are refused (stops one colluding sale
  # at an absurd price from moving money between accounts).
  max-price-multiplier: 3.0
  # Account level both sides of a sale between players need: below it a player can neither buy other
  # players' listings nor sell to other players, so a fresh account cannot hand its starting money to
  # another one on day one in either direction (1 = no requirement). Listing, system buyers and the
  # trader are not affected.
  min-buy-level: 3
  # Refuse sales between players when buyer and seller have logged in from the same address (each
  # profile keeps its last 4). OFF by default: players on one LAN, in one household or behind one
  # carrier NAT share an address and could not trade. Worth turning on for a public server; the real
  # fix for second accounts is online-mode=true.
  block-same-ip: false
  # Most value a player can gain per day (04:00 reset) from trading with other players (0 = no cap):
  # what other players pay for their listings after tax, plus how far below the reference price they
  # buy other players' listings, so underpriced sales count as well as overpriced ones. OFF by default:
  # friends trading gear on a small or LAN server would hit any cap low enough to matter. Sales to
  # system buyers never count towards it.
  daily-player-income-cap: 0
  # The trade price shown in the market is information only: it follows sales between players (never
  # system buyers), counted per plain unit with attachments, loaded ammo and wear divided out. Sales
  # outside [trade-outlier-min, trade-outlier-max] x the reference price are ignored, and the result is
  # kept within [trade-price-min, trade-price-max] x the plain unit's reference price.
  trade-outlier-min: 0.5
  trade-outlier-max: 2.0
  trade-price-min: 0.6
  trade-price-max: 1.5

rank:
  min-level: 3
  # Flat experience for extracting (times the tier's xp), in full with at least extract-xp-min-gear
  # of gear value brought in (the knife does not count) and in proportion below that, so a naked
  # run gets none of it. Profit (1 per ◈800) and kills earn their own experience on top.
  extract-xp: 150
  extract-xp-min-gear: 15000

hideout:
  # Intel centre income per hour by level (level 0 first); at most 24 hours of it add up between
  # collections. Workbench and med station recipes are set in HideoutService (tools/econ/balance.py
  # checks they save money against the trader without selling for more than they cost).
  intel-income: [0, 1000, 2000, 4000]

tasks:
  # Cost of swapping an unfinished daily contract, and the bonus for finishing all three.
  reroll-cost: 3000
  all-done-bonus: 20000

escort:
  # Share of the reward paid to escorts when the client dies.
  failure-share: 0.3

tutorial:
  # Step-by-step guide for new players (terminal, range, gunsmith, deploy, extract) and its reward.
  enabled: true
  reward: 20000

season:
  # Changing the id starts a new season (everyone's pass progress resets).
  id: S1
  name: 第一赛季
  xp-per-tier: 1000

bounty:
  # Price of one bounty step placed from the lobby, and the house bounty on the top-ranked player.
  # The house bounty only pays when the top player queued for ranked and deployed with at least
  # champion-min-value of gear value (the knife does not count), and at most once a day.
  step: 10000
  champion: 20000
  champion-min-value: 60000

backup:
  # Zips plugins/Craftov/data, players and market.json into plugins/Craftov/backups: a daily copy
  # (*-auto.zip) and one on every shutdown (*-shutdown.zip), each kind kept separately.
  enabled: true
  # A daily copy is made once the newest one is this old; restarts do not add extra ones.
  interval-hours: 24
  # Minutes after start before the first check (then every ten minutes).
  first-delay-minutes: 10
  # How many copies of each kind are kept. backup.keep from older versions (both kinds together)
  # still applies to a kind until its own key is set here.
  keep-daily: 7
  keep-shutdown: 5

insurance:
  # Share of the insured gear's value charged on deploy; rarity-rate overrides it per rarity.
  rate: 0.08
  rarity-rate: { GOLD: 0.12, RED: 0.16 }
  # Chance each insured item left behind is gone anyway when the raid closes (someone else took
  # it), so dying among soldiers with nobody else around is no longer a full refund.
  loss-chance: 0.3
  # Minutes before what comes back reaches the mailbox (0 = at once). The time runs while the
  # owner is offline too; it arrives the next time they are online after that.
  return-minutes: 30

events:
  # Share of raids fought at night (dark; soldiers see half as far but spot lit tactical lights from afar).
  night-chance: 0.3
  # Maps that are always played in daylight (test maps).
  day-only-maps: [proving]
  # Random events per raid: blackout, barrage, reinforcements, supply drop, boss patrol.
  per-raid: 2
  blackout-seconds: 180

replay:
  # After being killed, watch the last six seconds again through the killer's eyes (Shift skips).
  enabled: true

cinematic:
  enabled: true

hud:
  # Use BetterHud when installed (HUD layout is installed automatically).
  betterhud: true
  # Keep the boss-bar HUD even when BetterHud is active.
  vanilla-bars-with-betterhud: false

pack:
  # Rebuild the CraftEngine pack automatically after Craftov updates its resources.
  auto-reload: true

search:
  # Seconds to reveal one item of each rarity. The same everywhere: containers never change it.
  seconds:
    WHITE: 0.6
    GREEN: 0.9
    BLUE: 1.3
    PURPLE: 1.9
    GOLD: 2.6
    RED: 3.6

test:
  # Test mode: every player can open the item catalog (/cv items, also in the terminal) to take any item
  # for free, top up money and reset health, and can see and queue for test maps (the proving ground).
  # Admins (craftov.admin) can always do both. Keep off on live servers.
  enabled: false
