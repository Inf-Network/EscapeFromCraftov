# Searchable container types. Rarity weights shift upward with map difficulty and hot zones.
#
# Loot shift of a roll: the difficulty's loot-shift plus the container's tier on the map (soldier
# bodies 0, the boss and supply drops 1), never above the difficulty's max-shift (config.yml tiers).
# Each rarity weight of the container is multiplied by (1 + shift-bonus x shift), never below 0, and
# at shift 2 a container holds up to one item more. A roll whose category has nothing at the rarity
# drawn takes the nearest lower rarity, or yields nothing. tools/econ/ev.py prints what this adds up
# to per container and per raid.
shift-bonus: { WHITE: -0.25, GREEN: -0.05, BLUE: 0.1, PURPLE: 0.3, GOLD: 0.5, RED: 1.0 }
containers:
  crate:
    name: "杂物箱"
    rows: 3
    items: [1, 3]
    hitbox-width: 0.9
    hitbox-height: 0.8
    categories: { VALUABLE: 55, AMMO: 12, MEDICAL: 10, THROWABLE: 4, KEY: 1.5, RIG: 3, BACKPACK: 3, HELMET: 3, ARMOR: 3, WEAPON: 2, COLLECTIBLE: 0.3, ATTACHMENT: 0.8 }
    rarity: { WHITE: 58, GREEN: 30, BLUE: 8.5, PURPLE: 2.6, GOLD: 0.6, RED: 0.08 }
