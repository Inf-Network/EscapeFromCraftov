  # Test-map armory: fixed contents, one of every item in the listed categories (searches fast).
  # Everything rolled from an all-of container is a test item: usable in the raid, worth nothing, never
  # stored, sold or collected, and taken back when its holder returns to the lobby.
  # Armory guns only take armory parts in the gunsmith, so the parts come in the same case.
  test_weapons:
    name: "测试军械库 · 武器配件"
