# P18: a striker-fired 9 mm pistol, black steel slide on an FDE polymer frame. Built by
# tools/art/meshprim.py from Quaternius' Pistol_1; the keys are described in k47.yml.
#
# Real widths at this scale (10.5 units for 186 mm, 17.7 mm a unit): slide 1.45, frame 1.35, grip 1.7.
source: Pistol_1
length: 10.5
paint: {Black: steel, Black2: steel, DarkMetal: fde, DarkWood: fde, Metal: steel}
pieces:
  - {piece: 0, width: 1.45}                                   # slide
  - {piece: 1, width: 1.35, mat: fde}                         # frame and grip (see boxes)
  - {piece: 3, width: 1.74, mat: fde}                         # grip texture panels
  - {piece: 4, width: 1.3}                                    # slide, front
  - {piece: 5, width: 0.45, mat: fde}                         # trigger guard
  - {piece: 6, width: 0.28, mat: polymer, detail: true}       # trigger
  - {piece: 7, width: 1.0, detail: true}                      # rear of the slide
  - {piece: 8, skip: true}                                    # front sight: rebuilt below
  - {piece: 9, skip: true}                                    # rear sight: rebuilt below
  - {piece: 10, skip: true}                                   # a lug on the slide, in front of the notch
  - {piece: [11, 12, 13, 14], width: 1.49, detail: true}      # slide serrations
boxes:
  - {at: [4.3, 6.5], piece: 1, width: 1.68, mat: fde}         # grip
parts:
  # Magazine: inside the grip, its base plate showing; it drops out along the grip.
  - {centre: [3.95, 6.4, 8.0], size: [4.2, 1.3, 1.2], rot: 71.5, part: mag, mat: steel}
  - {centre: [3.35, 4.45, 8.0], size: [1.62, 0.32, 1.5], rot: -18.5, part: mag, mat: polymer}
  # Rear sight: two ears round the notch. Front sight: a post with a white dot on its back, its top
  # level with the ears' (the sight line).
  - {from: [3.15, 11.0, 7.45], to: [3.55, 11.3, 7.86], detail: true}
  - {from: [3.15, 11.0, 8.14], to: [3.55, 11.3, 8.55], detail: true}
  - {from: [3.15, 10.92, 7.45], to: [3.55, 11.06, 8.55]}
  - {from: [11.6, 11.0, 7.88], to: [11.9, 11.3, 8.12], detail: true}
  - {from: [11.58, 11.14, 7.95], to: [11.62, 11.24, 8.05], mat: dot, detail: true}
  # Barrel crown in the slide's front, and the slide stop on the left.
  - {from: [12.4, 10.05, 7.72], to: [12.55, 10.55, 8.28], mat: bare, detail: true}
  - {from: [6.6, 9.35, 7.26], to: [7.6, 9.6, 7.34], detail: true}
sight_y: 11.3
eye: [3.35, 0.42]
mag_axis: [-0.32, -0.95]
hands: {grip: [4.5, 7.5, 77.4]}
